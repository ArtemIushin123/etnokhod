<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Этноход - прототип</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preload" as="image" href="assets/bg-main.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Ruslan+Display&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary:#4B0082; --primary-d:#33005c; --sky:#fff3e0; --paper:#FFEBCD;
            --green:#2a8a4f; --gold:#DAA520; --red:#A52A2A; --accent:#6495ED;
            --ink:#2b1a33; --muted:#6e5a4c; --line:#ecd3ab; --white:#fffaf1;
            --card:rgba(255,250,241,.94); --shadow:0 8px 30px rgba(43,26,51,.18);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font:17px/1.55 'PT Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper)}
        body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--paper) center/cover no-repeat}
        body[data-bg=main]::before{background-image:url(assets/bg-main.webp)}
        body[data-bg=map]::before{background-image:url(assets/bg-map.webp)}
        body[data-bg=bashkortostan]::before{background-image:url(assets/bg-bashkortostan.webp)}
        .card{background:var(--card);border-radius:20px;padding:24px 26px;box-shadow:var(--shadow)}
        h1,h2,h3{font-family:'Ruslan Display',Georgia,serif;font-weight:400;line-height:1.15;margin:0;color:var(--primary)}
        p{margin:0}
        button{font:inherit;color:inherit}
        :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

        .top{background:var(--primary-d)}
        .band{display:block;width:100%;height:24px}
        .bar{background:var(--card);border-bottom:2px solid var(--gold);box-shadow:0 2px 12px rgba(43,26,51,.12)}
        .bar-in{max-width:1040px;margin:0 auto;padding:5px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
        .brand{display:inline-flex;align-items:center;gap:10px;font-family:'Ruslan Display',Georgia,serif;font-size:26px;color:var(--primary);text-decoration:none}
        .brand img{width:44px;height:44px;flex:none}
        .brand small{font:12px 'PT Sans',sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
        .status{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
        .status .mini{width:46px;height:46px;flex:none;overflow:hidden;border-radius:50%;background:var(--sky);border:2px solid var(--gold);display:flex;justify-content:center}
        .status .mini .av{margin-top:2px}
        .status .mini .av.hatted{margin-top:12px}
        .coin{display:block;width:34px;height:34px;flex:none}
        .coin.lg{width:56px;height:56px}

        .wrap{flex:1 0 auto;width:100%;max-width:1040px;margin:0 auto;padding:clamp(12px,2.5vh,28px) 20px clamp(12px,2.5vh,24px)}

        .btn{display:inline-block;border:0;background:var(--primary);color:#fff;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;border-bottom:4px solid var(--primary-d)}
        .btn:hover{background:#3c006b}
        .btn:disabled{background:#cdbfae;border-bottom-color:#b3a390;cursor:not-allowed}
        .btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);border-bottom-width:2px}
        .btn.ghost:hover{background:var(--sky)}
        .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

        .start{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:center}
        .start h1{font-size:clamp(30px,min(4.6vw,7vh),60px)}
        .lead{font-size:clamp(17px,2.4vh,20px);max-width:44ch;margin:clamp(8px,1.6vh,16px) 0 clamp(12px,2.4vh,24px);color:var(--ink)}
        .heroes{border:0;padding:0;margin:0 0 clamp(10px,1.8vh,18px);display:flex;gap:14px}
        .heroes legend,.hair legend{font-weight:700;margin-bottom:10px;padding:0}
        .hero-card{position:relative;flex:1;max-width:210px;background:var(--white);border:3px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:border-color .15s,transform .15s}
        .hero-card:hover{transform:translateY(-2px)}
        .hero-card input{position:absolute;opacity:0;inset:0;cursor:pointer}
        .hero-card:has(input:checked){border-color:var(--primary);background:var(--sky);box-shadow:0 0 0 3px var(--gold)}
        .hero-card:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}
        .hero-card span{display:block;font-weight:700;margin-top:6px}
        .hair{border:0;padding:0;margin:0}
        .hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
        .hair-opts{display:flex;gap:10px;flex-wrap:wrap}
        .swatch{position:relative;display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border:3px solid var(--line);border-radius:30px;background:var(--white);cursor:pointer;font-weight:700}
        .swatch{--c:#6b3f2a}
        .swatch i{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.15);background:var(--c)}
        .swatch input{position:absolute;opacity:0;inset:0;cursor:pointer}
        .swatch:has(input:checked){border-color:var(--primary);background:var(--sky)}
        .swatch:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}
        .medal{width:100%;height:auto;max-width:min(380px,55vh);justify-self:center;filter:drop-shadow(0 10px 24px rgba(43,26,51,.35))}
        .av{--h:200px;position:relative;display:inline-block;flex:none;height:var(--h);line-height:0}
        .av img{display:block;height:var(--h);width:auto}
        .av.hatted{margin-top:calc(var(--h) * .1)}
        .av .hat{position:absolute;height:auto;max-width:none}

        .map-head{padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
        .map-note{text-align:right;margin:2px 8px 0;font-size:12px}
        .map-head p{color:var(--muted);margin-top:6px}
        .map-wrap{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:10px;margin-top:12px;box-shadow:var(--shadow)}
        .map-wrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 320px);min-height:220px;margin:0 auto}
        .mk,.rg{cursor:pointer}
        .mk text{font:700 16px 'PT Sans',sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
        .mk.locked text{font-size:12px;font-weight:400;fill:#6e5a4c;stroke-width:4px}
        .mk.locked .dot{opacity:.85}
        .mk-s{transform:scale(var(--mk,1))}
        .mk .hit{fill:transparent}
        .lead line{stroke:#8a7560;stroke-width:1;stroke-dasharray:2 2}
        .lead circle{fill:#8a7560}
        .mk:focus-visible{outline:none}
        .mk:focus-visible circle.dot{stroke:var(--primary);stroke-width:4}
        .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2s ease-out infinite}
        @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
        .note{font-size:14px;color:var(--muted)}

        .region{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
        .guide{position:sticky;top:16px;text-align:center}
        .guide-img{display:block;width:auto;max-width:210px;height:clamp(240px,calc(100vh - 250px),580px);margin:0 auto;filter:drop-shadow(0 8px 14px rgba(43,26,51,.35))}
        .plate{margin-top:8px;line-height:1.3;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
        .plate b{display:block;font-family:'Ruslan Display',Georgia,serif;font-weight:400;font-size:24px;color:var(--primary)}
        .plate span{font-size:14px;color:var(--muted)}
        .crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--muted)}
        .crumbs li{list-style:none;padding:3px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
        .crumbs{padding:0}
        .crumbs li.on{background:var(--primary);border-color:var(--primary);color:#fff}
        .crumbs li.past{background:var(--sky)}
        .bubble{position:relative;margin-bottom:12px;font-size:18px;min-height:122px;
            border:1px solid transparent;
            border-image:url(assets/bubble-guide.webp) 40 205 150 125 fill / 20px 102px 75px 62px stretch;
            padding:22px 104px 50px 54px;filter:drop-shadow(0 6px 12px rgba(43,26,51,.25))}
        .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.4vh,22px) 22px;box-shadow:var(--shadow)}
        .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
        .tab{border:2px solid var(--line);background:var(--white);border-radius:24px;padding:7px 16px;cursor:pointer;font-weight:700}
        .tab[aria-selected=true]{background:var(--primary);border-color:var(--primary);color:#fff}
        .tab .ck{color:var(--green);margin-left:4px}
        .tab[aria-selected=true] .ck{color:var(--gold)}
        .picks{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
        .pick{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700}
        .pick[aria-pressed=true]{border-color:var(--red);background:#fdf1ee}
        .pick.gl{flex-direction:column;padding:10px 14px;color:var(--red)}
        .pick.gl span{color:var(--ink);font-size:15px}
        .detail{border-left:5px solid var(--gold);background:var(--paper);padding:14px 18px;border-radius:0 12px 12px 0;min-height:88px}
        .detail h3{font-size:24px;margin-bottom:4px}
        .glyph{color:currentColor}
        .story p{font-size:18px;font-family:Georgia,'PT Serif',serif;line-height:1.65;max-width:60ch}
        .story .pg{font-size:14px;color:var(--muted);margin-top:10px}

        .qcard h2{font:700 clamp(19px,2.8vh,23px)/1.3 'PT Sans',sans-serif;color:var(--ink);margin-bottom:12px}
        .prog{height:8px;background:var(--sky);border-radius:8px;overflow:hidden;margin-bottom:12px}
        .prog i{display:block;height:100%;background:var(--green)}
        .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .opt{text-align:left;border:2px solid var(--line);background:var(--white);border-radius:12px;padding:11px 16px;cursor:pointer;font-size:18px;font-weight:700}
        .opt:hover:not(:disabled){border-color:var(--primary)}
        .opt.ok{border-color:var(--green);background:#eaf6ee}
        .opt.bad{border-color:var(--red);background:#fdf1ee}
        .opt:disabled{cursor:default}
        .explain{flex:1 1 300px;padding:10px 16px;border-radius:12px;background:var(--sky)}
        .qfoot{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-top:12px}
        .match{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:420px;margin:6px 0 10px}
        .mcell{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;text-align:center}
        .slot.next{border:2px dashed var(--accent);box-shadow:0 0 0 3px rgba(100,149,237,.25)}
        .palette{display:flex;gap:10px;flex-wrap:wrap}
        .pal-row{margin-top:4px}
        .tile{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--white);border:2px solid var(--primary);color:var(--red);padding:0}
        .slot{border:2px dashed #c9ab7e;background:var(--paper);cursor:pointer}
        .slot.filled{border-style:solid;border-color:var(--primary)}
        .slot.ok{border-color:var(--green);background:#eaf6ee}
        .slot.bad{border-color:var(--red);background:#fdf1ee}
        .palette .tile{cursor:pointer;border-color:var(--line)}
        .palette .tile:hover{border-color:var(--red)}
        .lab{font-weight:700;font-size:15px;color:var(--muted)}

        .reward{text-align:center}
        .reward h2{font-size:clamp(26px,min(5vw,5.5vh),40px)}
        .reward-body{display:flex;justify-content:center;align-items:center;gap:12px 36px;flex-wrap:wrap}
        .reward .stage-av{display:flex;justify-content:center;align-items:flex-end;margin:8px 0}
        .reward .stage-av .av{--h:clamp(150px,calc(100vh - 440px),280px)}
        .reward-side{display:flex;flex-direction:column;align-items:center}
        .hero-card .av{--h:clamp(120px,calc(100vh - 530px),190px)}
        .me-btn{display:flex;align-items:center;gap:10px;background:none;border:2px solid transparent;border-radius:30px;padding:1px 12px 1px 1px;cursor:pointer;color:var(--muted);font-size:inherit;text-align:left}
        .me-btn:hover,.me-btn.on{border-color:var(--gold);background:var(--sky)}
        .profile{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
        .prof-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
        .prof-av .av{--h:clamp(150px,calc(100vh - 480px),300px)}
        .prof-hero h2{font-size:28px;margin-top:6px;word-break:break-word}
        .prof-btns{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:100%}
        .prof-main .stats{margin-bottom:12px}
        .prof-main .tpanel{margin-bottom:12px;padding:16px 20px}
        .awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
        .award{display:flex;align-items:center;gap:12px;background:var(--sky);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px}
        .award.locked{background:#f3ede4}
        .award.locked .coin{filter:grayscale(1);opacity:.45}
        .reg-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
        .reg-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
        .reg-list li:nth-last-child(-n+2){border-bottom:0}
        .gifts{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:6px 0 14px}
        .gift{background:var(--sky);border:1px solid var(--line);border-radius:14px;padding:10px 18px 10px 10px;display:flex;align-items:center;gap:12px;text-align:left}
        .unlock{margin:0 auto 14px;max-width:46ch}

        .ask{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--primary);color:#fff;border:0;border-bottom:4px solid var(--primary-d);border-radius:30px;padding:12px 22px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(43,26,51,.25)}
        .chat{position:fixed;right:18px;bottom:18px;z-index:30;width:min(390px,calc(100vw - 24px));height:min(580px,82vh);background:var(--white);border:2px solid var(--primary);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(43,26,51,.3)}
        .chat[hidden],.ask[hidden]{display:none}
        .chat-h{background:var(--primary);color:#fff;padding:8px 14px 8px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
        .chat-h b{font-family:'Ruslan Display',Georgia,serif;font-weight:400;font-size:20px;display:flex;align-items:center;gap:10px}
        .chat-h .face{width:40px;height:40px;border-radius:50%;background:var(--paper) url(assets/guide-daniyar.webp) center 0/120% auto no-repeat;border:2px solid var(--gold);flex:none}
        .chat-h button{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer}
        .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#9a2c2a url(assets/bg-chat.webp) 0 0/260px}
        .m{flex:none;max-width:88%;padding:9px 13px;border-radius:14px;font-size:16px}
        .m.bot{align-self:flex-start;border:1px solid transparent;border-radius:0;
            border-image:url(assets/bubble-chat.webp) 165 85 75 145 fill / 43px 22px 20px 38px stretch;
            padding:34px 20px 16px 20px;min-height:76px;min-width:130px}
        .m.hidden{font-style:italic;opacity:.75}
        .m.me{background:var(--paper);color:var(--ink);border:2px solid var(--gold);align-self:flex-end;border-bottom-right-radius:4px}
        .sugg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
        .sugg button{border:1px solid var(--line);background:var(--sky);border-radius:16px;padding:4px 11px;font-size:14px;cursor:pointer}
        .chat form{display:flex;gap:8px;padding:10px 12px 12px}
        .chat input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
        .chat input:focus{border-color:var(--primary);outline:none}
        .chat form .btn{padding:9px 16px}

        #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--primary-d);color:#fff;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100vw - 32px);text-align:center}
        #toast.on{opacity:1;transform:translateX(-50%)}
        dialog{background:var(--white);color:var(--ink);border:2px solid var(--gold);border-radius:18px;padding:24px;max-width:440px}
        dialog::backdrop{background:rgba(43,26,51,.5)}
        dialog h3{font-size:28px;margin-bottom:8px}
        dialog p{margin-bottom:18px}
        footer{flex:none;width:calc(100% - 32px);max-width:1000px;margin:0 auto 10px;padding:6px 16px;border-radius:12px;background:var(--card);font-size:13px;line-height:1.4;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
        footer button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:0}

        .panel > p + p,[role=tabpanel] > p + p{margin-top:8px}
        .join{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.2vh,20px) 20px;max-width:480px;display:grid;gap:6px}
        .join-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .join-row > div{display:grid;gap:4px}
        .join h2{font-size:24px;margin-bottom:2px}
        .join label{font-weight:700;margin-top:2px}
        .join input{border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
        .join input:focus{border-color:var(--primary);outline:none}
        .join .btn{justify-self:start;margin-top:8px}
        .hint{font-size:14px;color:var(--muted)}
        .err{color:var(--red);font-weight:700;font-size:15px}
        .err:empty{display:none}
        .teacher-link{margin-top:clamp(8px,1.6vh,16px);color:var(--muted)}
        .linkbtn{background:none;border:0;padding:0;color:var(--primary);font-weight:700;text-decoration:underline;cursor:pointer}
        .start h1.hi{font-size:clamp(28px,min(4.4vw,6.5vh),50px)}

        .t-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
        .t-head p{color:var(--muted);margin-top:6px;max-width:60ch}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
        .stat{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:12px 16px}
        .stat b{display:block;font-size:28px;color:var(--primary);line-height:1.15}
        .stat span{font-size:14px;color:var(--muted)}
        .tpanel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
        .tpanel h3{font-size:22px;margin-bottom:12px}
        .tpanel p + p{margin-top:10px}
        .tscroll{overflow-x:auto}
        table.cls{width:100%;border-collapse:collapse;font-size:16px;min-width:540px}
        .cls th{text-align:left;font-size:14px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
        .cls td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
        .cls tr.me td{background:#fff8e6}
        .tag{display:inline-block;padding:2px 10px;border-radius:14px;font-size:14px;font-weight:700;white-space:nowrap}
        .tag.done{background:#eaf6ee;color:#1f6b3c}
        .tag.fail{background:#fdf1ee;color:#a3301f}
        .tag.learning{background:var(--sky);color:var(--primary)}
        .tag.none{background:#eef1f3;color:var(--muted)}
        .t-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
        .t-grid .tpanel{margin-bottom:0}
        .bars{display:grid;gap:10px;margin-bottom:14px}
        .barrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:15px}
        .barrow i{display:block;height:10px;border-radius:6px;background:var(--red)}
        .codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
        .codebox code{font:700 24px 'PT Sans',sans-serif;letter-spacing:.08em;background:var(--sky);padding:4px 14px;border-radius:10px;color:var(--primary)}
        .switch{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:none;border:0;padding:12px 0;border-top:1px solid var(--line);text-align:left;cursor:pointer}

        .switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
        .switch[aria-checked=true] .knob{background:var(--green)}

        .plan{margin:0;padding-left:22px;display:grid;gap:10px}
        .plan b{color:var(--primary)}
        .chat form[hidden]{display:none}
        .chat-note{margin:8px 12px 12px;font-size:14px;color:var(--muted)}

                border-image:url(assets/bubble-chat.webp) 165 85 75 145 fill / 50px 26px 23px 44px stretch;

            .brand{font-size:18px;white-space:nowrap;gap:8px}
            .brand img{width:34px;height:34px}

            .reward .stage-av .av{--h:clamp(150px,calc(100vh - 520px),220px)}
            body[data-bg=bashkortostan] footer{margin-bottom:72px}
        }
        @media (max-width:760px){
            .profile{grid-template-columns:1fr}

        }

</head>

        const label = `${r.name}, ${done?'пройден':open?'открыт':'закрыт'}`;
        const at = r.callout || r;
        const lead = r.callout ? `<g class="lead" aria-hidden="true"><line x1="${r.x}" y1="${r.y}" x2="${at.x}" y2="${at.y}"/><circle cx="${r.x}" cy="${r.y}" r="2.5"/></g>` : '';
        return `${lead}<g class="mk ${state}" transform="translate(${at.x} ${at.y})" tabindex="0" role="button" data-act="region" data-region="${r.id}" data-id="mk-${r.id}" aria-label="${label}">
    <g class="mk-s"><circle class="hit" r="22"/>${pulse}<circle class="dot" r="${R}" fill="${fill}" stroke="#fff" stroke-width="${big ? 3 : 2}"/>${icon}
    <text ${txt}>${r.name}</text></g></g>`;
    }

    function regionShape(r){
        const d = RU_MAP.regions[r.id]; if(!d) return '';
        const done = S.done.includes(r.id), open = S.unlocked.includes(r.id);
        const fill = done ? '#2a8a4f' : open ? '#DAA520' : '#b3a390';
        return `<path class="rg" d="${d}" fill="${fill}" fill-opacity="${done||open ? .55 : .4}" data-act="region" data-region="${r.id}" aria-hidden="true"/>`;
    }

    function rMap(){
        const outline = RU_MAP.outline;
        const [vx, vy, vw, vh] = RU_MAP.viewBox.split(' ').map(Number);
        const minX = Math.min(vx, ...MAP.filter(r => r.callout).map(r => r.callout.x - 10));
        const viewBox = `${minX} ${vy} ${vw + vx - minX} ${vh}`;
        const first = S.done.length === 0;
        const hint = first
            ? 'Нажми на Башкортостан: это стартовый регион. Остальные откроются позже.'
            : 'Башкортостан пройден! Следующий регион открыт, но в прототипе он ещё не готов.';
        app.innerHTML = `
  <section>
    <div class="map-head card"><div><h2>Карта России</h2><p>${hint}</p></div></div>
    <div class="map-wrap">
      <svg viewBox="${viewBox}" role="group" aria-label="Карта России с регионами">
        <path d="${outline}" fill="none" stroke="#A52A2A" stroke-width="9" stroke-dasharray="1 12" stroke-linecap="round"/>
        <path d="${outline}" fill="#fff3e0" stroke="#4B0082" stroke-width="2.5" stroke-linejoin="round"/>
        ${MAP.map(regionShape).join('')}
        <path d="${RU_MAP.inner}" fill="none" stroke="#d9b98a" stroke-width=".7" stroke-linejoin="round"/>
        ${MAP.map(marker).join('')}
      </svg>
      <p class="note map-note">Границы регионов упрощены.</p>
    </div>
  </section>`;
    }

    function rProfile(){
        const G_ = HEROES.genders[S.hero] || HEROES.genders.m;
        const res = S.results.bashkortostan;
        const total = REGIONS.bashkortostan.quiz.length;
        const earned = Object.keys(REWARDS).filter(k => S.rewards.includes(k));
        const awards = Object.entries(REWARDS).map(([k,r]) => {
            const got = S.rewards.includes(k);
            return `<div class="award${got?'':' locked'}">${coin(k,'lg')}<div><b>${r.title}</b><br><span class="note">${got ? r.desc : 'Пока не получено. Пройди Башкортостан, чтобы открыть.'}</span></div></div>`;
        }).join('');
        const regions = MAP.map(r => {
            const done = S.done.includes(r.id), open = S.unlocked.includes(r.id);
            const rr = S.results[r.id];
            const tag = done ? '<span class="tag done">Пройден</span>' : open ? '<span class="tag learning">Открыт</span>' : '<span class="tag none">Закрыт</span>';
            const extra = rr ? `<span class="note">Лучший результат теста: ${rr.score} из ${rr.total}${rr.wrong && rr.wrong.length ? `. Стоит повторить: ${rr.wrong.map(esc).join(', ')}` : ''}</span>` : '';
            return `<li><div><b>${r.name}</b>${extra ? '<br>' + extra : ''}</div>${tag}</li>`;
        }).join('');
        app.innerHTML = `
  <section class="profile">
    <div class="card prof-hero">
      <div class="prof-av">${avatar(S.hero, S.hair, S.rewards.includes('burek'))}</div>
      <h2>${esc(S.nick)}</h2>
      <p class="note">${G_.title} · класс ${DEMO_CLASS.name}</p>
      <div class="prof-btns">
        <button class="btn" data-act="map" data-id="map">К карте</button>
      </div>
    </div>
    <div class="prof-main">
      <div class="stats">
        <div class="stat"><b>${S.done.length} из ${MAP.length}</b><span>регионов пройдено</span></div>
        <div class="stat"><b>${res ? `${res.score} из ${total}` : '—'}</b><span>лучший результат теста</span></div>
        <div class="stat"><b>${earned.length} из ${Object.keys(REWARDS).length}</b><span>наград собрано</span></div>
      </div>
      <div class="tpanel"><h3>Мои награды</h3><div class="awards">${awards}</div></div>
      <div class="tpanel"><h3>Регионы</h3><ul class="reg-list">${regions}</ul></div>
    </div>
  </section>`;
    }

    const STEPS = [['learn','Знакомство'],['quiz','Тест'],['reward','Награда']];
    function crumbs(){
        const order = {intro:-1, learn:0, quiz:1, result:1, reward:2};
        const cur = order[R.step];
        return `<ol class="crumbs" aria-label="Этапы">${STEPS.map((s,i)=>`<li class="${i===cur?'on':i<cur?'past':''}" ${i===cur?'aria-current="step"':''}>${s[1]}</li>`).join('')}</ol>`;
    }

    function rRegion(){
        const reg = REGIONS.bashkortostan;
        let bubble = '', stage = '';
        if(R.step==='intro'){
            bubble = reg.intro[R.d];
            const last = R.d === reg.intro.length-1;
            stage = `<div class="row">${last
                ? '<button class="btn" data-act="learn" data-id="next">Узнать о культуре</button>'
                : '<button class="btn" data-act="intro" data-id="next">Дальше</button>'}</div>`;
        }
        else if(R.step==='learn'){
            const seen = reg.learn.filter(t=>R.visited[t.id]).length;
            bubble = seen<reg.learn.length
                ? `Открой все четыре раздела. Пока открыто ${seen} из ${reg.learn.length}.`
                : `Отлично, ты всё ${byHero('посмотрел','посмотрела')}! Можно пройти тест. Или спроси меня о чём-нибудь в чате.`;
            stage = crumbs() + learnPanel(reg) +
                `<div class="row" style="margin-top:18px"><button class="btn" data-act="quiz" data-id="quiz" ${seen<reg.learn.length?'disabled':''}>Пройти тест</button></div>`;
        }
        else if(R.step==='quiz'){
            const q = reg.quiz[R.q.i];
            bubble = q.say;
            stage = crumbs() + quizCard(reg, q);
        }
        else if(R.step==='result'){
            const ok = R.q.score >= reg.passScore;
            bubble = ok ? `Молодец! Ты отлично ${byHero('запомнил','запомнила')}.` : 'Почти получилось! Давай повторим и попробуем ещё раз.';
            stage = crumbs() + `<div class="panel"><h2>Верно: ${R.q.score} из ${reg.quiz.length}</h2>
      <p style="margin:10px 0 18px">${ok?'Регион пройден: держи награду.':`Чтобы открыть следующий регион, нужно набрать хотя бы ${reg.passScore}.`}</p>
      <div class="row">${ok
                ? '<button class="btn" data-act="reward" data-id="rw">Получить награду</button>'
                : '<button class="btn" data-act="retry" data-id="retry">Пройти тест ещё раз</button><button class="btn ghost" data-act="learn" data-id="back">Повторить материал</button>'}</div></div>`;
        }
        else if(R.step==='reward'){
            bubble = `Ты ${byHero('прошёл','прошла')} Башкортостан! Эта шапка теперь твоя.`;
            stage = crumbs() + `<div class="panel reward">
      <h2>Регион пройден</h2>
      <div class="reward-body">
      <div class="stage-av">${avatar(S.hero,S.hair,true)}</div>
      <div class="reward-side">
      <div class="gifts">
        <div class="gift">${coin('burek','lg')}<div><b>${REWARDS.burek.title}</b><br><span class="note">${REWARDS.burek.desc}</span></div></div>
        <div class="gift">${coin('kurai','lg')}<div><b>${REWARDS.kurai.title}</b><br><span class="note">${REWARDS.kurai.desc}</span></div></div>
      </div>
      <p class="unlock">Открыт новый регион: <b>Татарстан</b>.</p>
      <button class="btn" data-act="map" data-id="map">К карте</button></div></div></div>`;
        }
        app.innerHTML = `<section class="region">
    <aside class="guide">${guideImg(reg)}<div class="plate"><b>${reg.guide.name}</b><span>${reg.guide.role}</span></div></aside>
    <div class="stage"><div class="bubble" aria-live="polite">${bubble}</div>${stage}</div></section>`;
    }

    function learnPanel(reg){
        const tabs = reg.learn.map(t => `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="tabpanel" data-act="tab" data-tab="${t.id}" data-id="tab-${t.id}" aria-selected="${R.tab===t.id}">${t.label}${R.visited[t.id]?'<span class="ck" aria-label="открыто"> ✓</span>':''}</button>`).join('');
        const t = reg.learn.find(x=>x.id===R.tab);
        let body = [].concat(t.lead).map(x => `<p>${x}</p>`).join('');
        if(t.kind==='glyphs' || t.kind==='chips'){
            const i = R.sel[t.id] ?? 0;
            body += `<div class="picks">${t.items.map((it,n)=>
                t.kind==='glyphs'
                    ? `<button class="pick gl" data-act="sel" data-i="${n}" data-id="pick-${n}" aria-pressed="${n===i}">${glyph(it.g,48)}<span>${it.title}</span></button>`
                    : `<button class="pick" data-act="sel" data-i="${n}" data-id="pick-${n}" aria-pressed="${n===i}"><span aria-hidden="true">${it.icon}</span>${it.title}</button>`
            ).join('')}</div>
    <div class="detail" aria-live="polite"><h3>${t.items[i].title}</h3><p>${t.items[i].text}</p></div>`;
        } else {
            const p = R.page, n = t.pages.length;
            body += `<div class="story detail" style="margin-top:14px"><p>${t.pages[p]}</p><p class="pg">Часть ${p+1} из ${n}</p></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" data-act="pg" data-d="-1" data-id="pg-prev" ${p===0?'disabled':''}>Назад</button>
        <button class="btn ghost" data-act="pg" data-d="1" data-id="pg-next" ${p===n-1?'disabled':''}>Читать дальше</button></div>`;
        }
        return `<div class="panel"><div class="tabs" role="tablist">${tabs}</div><div role="tabpanel" id="tabpanel" aria-labelledby="tab-${t.id}">${body}</div></div>`;
    }

    function quizCard(reg, q){
        const st = R.q, total = reg.quiz.length;
        let html = `<div class="panel qcard"><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${st.i}"><i style="width:${st.i/total*100}%"></i></div>
    <p class="note" style="margin-bottom:6px">Задание ${st.i+1} из ${total}</p><h2>${q.title}</h2>`;
        const last = st.i === total-1;
        if(q.type==='choice'){
            html += `<div class="opts">${q.opts.map((o,n)=>{
                let cls = '';
                if(st.picked!==null){ if(n===q.ok) cls='ok'; else if(n===st.picked) cls='bad'; }
                return `<button class="opt ${cls}" data-act="answer" data-n="${n}" data-id="opt-${n}" ${st.picked!==null?'disabled':''}>${o}</button>`;
            }).join('')}</div>`;
            if(st.picked!==null){
                html += `<div class="qfoot"><div class="explain"><b>${st.picked===q.ok?'Верно.':'Не совсем.'}</b> ${q.explain}</div>
        <button class="btn" data-act="nextq" data-id="nextq">${last?'Узнать результат':'Дальше'}</button></div>`;
            }
        } else {
            const names = glyphNames(reg), pal = q.palette;
            const next = q.match.findIndex((_,n)=>!st.slots[n]);
            html += `<p class="lab">Нажми на знак внизу: он встанет в подсвеченную клетку. Нажми на клетку, чтобы убрать знак.</p>
      <div class="match">${q.match.map((k,n)=>{
                const v = st.slots[n];
                let cls = v ? 'filled' : n===next ? 'next' : '';
                if(st.checked) cls = v===k ? 'ok' : 'bad';
                return `<div class="mcell"><span>${names[k]}</span><button class="tile slot ${cls}" data-act="unslot" data-n="${n}" data-id="slot-${n}" aria-label="${names[k]}: ${v?names[v]:'пусто'}" ${st.checked?'disabled':''}>${v?glyph(v,40):''}</button></div>`;
            }).join('')}</div>
`;
            if(!st.checked){
                const full = q.match.every((_,n)=>st.slots[n]);
                html += `<p class="lab">Знаки</p>
      <div class="qfoot pal-row"><div class="palette">${pal.map(k=>`<button class="tile" data-act="slot" data-k="${k}" data-id="pal-${k}" aria-label="${names[k]}">${glyph(k,40)}</button>`).join('')}</div>
        <div class="row"><button class="btn" data-act="check" data-id="check" ${full?'':'disabled'}>Проверить</button><button class="btn ghost" data-act="clear" data-id="clear">Очистить</button></div></div>`;
            } else {
                const ok = q.match.every((k,n)=>st.slots[n]===k);
                html += `<div class="qfoot"><div class="explain"><b>${ok?'Верно.':'Не совсем.'}</b> ${q.explain}</div>
        <button class="btn" data-act="nextq" data-id="nextq">Дальше</button></div>`;
            }
        }
        return html + '</div>';
    }

    app.addEventListener('change', e => {
        const t = e.target;
        if(t.dataset.act==='hero'){ pendingHero = t.value; render(); }
        if(t.dataset.act==='hair'){ pendingHair = t.value; render(); }
    });

    function activate(el){
        const act = el.dataset.act;
        const reg = REGIONS.bashkortostan;
        switch(act){
            case 'go':
                if(!pendingHero) return;
                S.hero = pendingHero; S.hair = pendingHair; save(); S.screen = 'map'; render(true); break;
            case 'region': openRegion(el.dataset.region); break;
            case 'intro': R.d++; render(); break;
            case 'learn': R.step = 'learn'; render(true); break;
            case 'tab':
                R.tab = el.dataset.tab; R.visited[R.tab] = true; R.page = 0; render(); break;
            case 'sel': R.sel[R.tab] = +el.dataset.i; render(); break;
            case 'pg': R.page += +el.dataset.d; render(); break;
            case 'quiz': R.q = freshRegion().q; R.step = 'quiz'; render(true); break;
            case 'answer': {
                const q = reg.quiz[R.q.i]; R.q.picked = +el.dataset.n;
                if(R.q.picked === q.ok) R.q.score++; else R.q.wrong.push(q.topic);
                render(); break; }
            case 'slot': {
                const arr = reg.quiz[R.q.i].match.map((_,n)=>R.q.slots[n]||null);
                const free = arr.indexOf(null);
                if(free>-1){ arr[free] = el.dataset.k; R.q.slots = arr; }
                render(); break; }
            case 'unslot': {
                const arr = reg.quiz[R.q.i].match.map((_,n)=>R.q.slots[n]||null); arr[+el.dataset.n] = null; R.q.slots = arr; render(); break; }
            case 'clear': R.q.slots = []; render(); break;
            case 'check': {
                const q = reg.quiz[R.q.i]; R.q.checked = true;
                if(q.match.every((k,n)=>R.q.slots[n]===k)) R.q.score++; else R.q.wrong.push(q.topic);
                render(); break; }
            case 'nextq':
                if(R.q.i === reg.quiz.length-1){
                    R.step = 'result';
                    const prev = S.results.bashkortostan;
                    if(!prev || R.q.score >= prev.score)
                        S.results.bashkortostan = { score:R.q.score, total:reg.quiz.length, wrong:[...new Set(R.q.wrong)] };
                    save();
                }
                else { R.q.i++; R.q.picked = null; R.q.slots = []; R.q.checked = false; }
                render(true); break;
            case 'retry': R.q = freshRegion().q; R.step = 'quiz'; render(true); break;
            case 'reward':
                if(!S.done.includes('bashkortostan')) S.done.push('bashkortostan');
                if(!S.unlocked.includes('tatarstan')) S.unlocked.push('tatarstan');
                ['burek','kurai'].forEach(k=>{ if(!S.rewards.includes(k)) S.rewards.push(k); });
                save(); R.step = 'reward'; render(true); break;
            case 'map': S.screen = 'map'; closeChat(); render(true); break;
            case 'teacher': S.screen = 'teacher'; render(true); break;
            case 'profile': S.screen = 'profile'; closeChat(); render(true); break;
            case 'continue': S.screen = homeScreen(S); render(true); break;
            case 'switchUser': $('#reset').click(); break;
            case 'leaveTeacher': S.screen = homeScreen(S); render(true); break;
            case 'chatToggle':
                S.chatFree = !S.chatFree; save(); applyChatMode(); render();
                toast(S.chatFree ? 'Свободный чат включён' : 'Включён режим готовых вопросов'); break;
            case 'copyCode':
                try { navigator.clipboard.writeText(DEMO_CLASS.code).then(() => toast('Код класса скопирован'), () => toast('Код класса: ' + DEMO_CLASS.code)); }
                catch(e) { toast('Код класса: ' + DEMO_CLASS.code); }
                break;
        }
    }
    app.addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        if(el && el.dataset.act !== 'hero' && el.dataset.act !== 'hair') activate(el);
    });
    app.addEventListener('submit', e => {
        if(e.target.id !== 'joinForm') return;
        e.preventDefault();
        const code = $('#code').value.toUpperCase().replace(/\s+/g, '');
        const nick = $('#nick').value.trim();
        joinDraft = { code, nick };
        let field = null;
        if(!code){ joinErr = 'Введи код класса. Его даёт учитель.'; field = 'code'; }
        else if(code !== DEMO_CLASS.code){ joinErr = 'Класса с таким кодом нет. Проверь код у учителя.'; field = 'code'; }
        else if(!/^[A-Za-zА-Яа-яЁё0-9_-]{2,16}$/.test(nick)){ joinErr = 'Ник должен быть от 2 до 16 символов: буквы, цифры, _ или -, без пробелов.'; field = 'nick'; }
        else if(isRude(nick)){ joinErr = 'Такой ник не подойдёт. Придумай другой, без грубых слов.'; field = 'nick'; }
        if(field){ render(); $('#' + field).focus(); return; }
        joinErr = ''; S.nick = nick; S.classCode = code; save();
        S.screen = 'hero'; render(true);
    });
    app.addEventListener('keydown', e => {
        const el = e.target.closest('.mk');
        if(el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); activate(el); }
    });

    function openRegion(id){
        const open = S.unlocked.includes(id);
        const r = MAP.find(m=>m.id===id);
        if(!open){ toast('Регион закрыт. Сначала пройди Башкортостан.'); return; }
        if(id !== 'bashkortostan'){
            $('#dlgT').textContent = r.name;
            $('#dlgP').textContent = 'В прототипе этот регион ещё не готов. Здесь появится свой проводник в национальном костюме, знакомство с культурой и тест.';
            $('#dlg').showModal(); return;
        }
        R = freshRegion(); S.started = true; save(); S.screen = 'region'; render(true);
    }
    $('#status').addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(el) activate(el); });
    $('#dlgOk').addEventListener('click', () => $('#dlg').close());
    $('#home').addEventListener('click', e => {
        if(e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault(); S.screen = 'start'; joinErr = ''; closeChat(); render(true);
    });

    let toastT;
    function toast(msg){
        const t = $('#toast'); t.textContent = msg; t.classList.add('on');
        clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2800);
    }

    $('#reset').addEventListener('click', () => {
        try { localStorage.removeItem(KEY); } catch(e) {}
        S = load(); S.screen = 'start'; pendingHero = null; pendingHair = 'dark'; joinDraft = { code:'', nick:'' }; joinErr = ''; R = freshRegion(); closeChat(); applyChatMode(); render(true);
    });

    const history = [];
    function addMsg(text, who){
        const d = document.createElement('div'); d.className = 'm ' + who; d.textContent = text;
        $('#msgs').appendChild(d); $('#msgs').scrollTop = $('#msgs').scrollHeight;
    }
    function cannedReply(q){
        q = q.toLowerCase() + ' ';
        const hit = CANNED.find(c => c.k.some(k => q.includes(k)));
        return hit ? hit.a : FALLBACK;
    }
    async function askGuide(text){
        history.push({ role:'user', content:text });
        let reply = null;
        if(AI_PROXY_URL){
            try {
                const r = await fetch(AI_PROXY_URL, { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ system:GUIDE_PROMPT, messages:history }) });
                const d = await r.json(); reply = d.reply || null;
            } catch(e) { reply = null; }
        } else {
            await new Promise(res => setTimeout(res, 450));
        }
        if(reply && isRude(reply)) reply = null;
        reply = reply || cannedReply(text);
        history.push({ role:'assistant', content:reply });
        addMsg(reply, 'bot');
    }
    function openChat(){
        $('#chat').hidden = false; $('#askBtn').hidden = true;
        if(!$('#msgs').children.length) addMsg(GREETING, 'bot');
        $('#sugg').innerHTML = SUGGESTIONS.map(s=>`<button type="button">${s}</button>`).join('');
        applyChatMode();
        (S.chatFree ? $('#chatIn') : $('#sugg button')).focus();
    }
    function applyChatMode(){
        $('#chatForm').hidden = !S.chatFree;
        $('#chatNote').hidden = S.chatFree;
    }
    function closeChat(){ $('#chat').hidden = true; $('#askBtn').hidden = S.screen !== 'region'; }
    $('#askBtn').addEventListener('click', openChat);
    $('#chatClose').addEventListener('click', closeChat);
    $('#sugg').addEventListener('click', e => {
        if(e.target.tagName==='BUTTON'){ addMsg(e.target.textContent,'me'); askGuide(e.target.textContent); }
    });
    $('#chatForm').addEventListener('submit', e => {
        e.preventDefault();
        const v = $('#chatIn').value.trim(); if(!v) return;
        $('#chatIn').value = '';
        if(isRude(v)){ addMsg('Сообщение скрыто: в нём грубые слова.', 'me hidden'); addMsg(RUDE_REPLY, 'bot'); return; }
        addMsg(v,'me'); askGuide(v);
    })
    render(true);
</script>
</body>
</html>
